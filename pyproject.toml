[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-breed-recognizer"
version = "0.1.0"
description = "CLI foundation for Indian cattle and buffalo breed recognition."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]